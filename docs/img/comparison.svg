<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Anchor versus the standard architecture, measured">
<rect width="900" height="300" rx="14" fill="#161920"/>
<text x="32" y="42" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Same incident. Same API. Same crash point.</text>
<text x="32" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#b9bcc4">Measured by cmd/compare, which kills real processes. Not a claim.</text>

<rect x="32" y="92" width="404" height="176" rx="12" fill="none" stroke="#0ca30c" stroke-width="2"/>
<text x="52" y="120" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#7d818b" letter-spacing="1">ANCHOR</text>
<text x="52" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="52" font-weight="650" fill="#0ca30c">1</text>
<text x="96" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#7d818b">external operation</text>
<text x="52" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b9bcc4">The reconciler verified against the</text>
<text x="52" y="232" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b9bcc4">audit log and committed without</text>
<text x="52" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b9bcc4">acting again.</text>

<rect x="464" y="92" width="404" height="176" rx="12" fill="none" stroke="#d03b3b" stroke-width="2"/>
<text x="484" y="120" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#7d818b" letter-spacing="1">CONTROL &#183; POSTGRES + VECTOR DB</text>
<text x="484" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="52" font-weight="650" fill="#d03b3b">2</text>
<text x="528" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#7d818b">external operations</text>
<text x="484" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b9bcc4">No durable intent existed, so the</text>
<text x="484" y="232" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b9bcc4">restart could not tell "never happened"</text>
<text x="484" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b9bcc4">from "happened and we crashed".</text>
</svg>