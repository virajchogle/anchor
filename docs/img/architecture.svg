<text x="50" y="742" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#b9bcc4" text-anchor="start">If phase 3 were two transactions, the memory write could fail alone and the agent's history would diverge from what it did.</text>
<text x="50" y="776" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#d03b3b" text-anchor="start">We shipped that architecture as a control: same crash, it performs 2 external operations instead of 1.</text>
