<text x="50" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="33" font-weight="680" fill="#ffffff" text-anchor="start">Anchor: how the agent, CockroachDB and AWS interact</text>
